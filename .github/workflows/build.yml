name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore HADash.sln
      - name: Build
        run: dotnet build HADash.sln -c Release --no-restore
      - name: Package
        shell: pwsh
        run: ./build/package.ps1 -Configuration Release -Runtime win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: HADash-portable
          path: artifacts/packages/*.zip
